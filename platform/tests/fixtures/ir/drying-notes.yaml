id: ROOT
name: Drying rack notes
description: Neighbors leave notes about racks that are still damp.
children:
  - id: REQ-NOTE
    name: Leave a drying note
    description: A neighbor writes a short note after the rack cools.
    scenarios:
      - id: SCN-NOTE
        name: Save a note
        steps:
          - Given: The neighbor is already signed in.
            When: They write a note about the damp rack and save the note.
            Then: The new note is shown.
    children: []
