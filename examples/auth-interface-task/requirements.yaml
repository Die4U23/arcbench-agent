id: ROOT
name: Login and Registration Interface
children:
  - id: REQ-AUTH-INTERFACE
    name: Build a polished account access experience
    description: >-
      Create a polished, responsive website for a fictional product called ArcDesk.
      It must provide sign-in and account-creation forms with a clear way to switch
      between them. Sign-in includes email and password, remember-me, forgot-password,
      and submit controls. Registration includes full name, email, password, password
      confirmation, and acceptance of terms. Add accessible labels, required-field,
      email, password-length and password-match validation, password visibility
      toggles, inline errors, and a visible success state after valid local submission.
      Define sign-in validity by the form rules only (a syntactically valid email and a
      non-empty password meeting the stated minimum length); do not check whether the
      account exists or whether the password is correct. Any values meeting those rules
      must reach the local success state. For registration, any full name and syntactically
      valid email are acceptable when the password meets the stated minimum, confirmation
      matches, and terms are accepted. Keep form handling local; do not call a backend or
      external service, or imply that an account was actually authenticated or created.
      Automated tests must assert these successful local submissions and representative
      invalid-input cases. Ensure the layout works on mobile and desktop. Provide package.json
      scripts for build and test, and include meaningful automated tests for the main
      form interactions.
