name: Platform generator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-package:
    name: Platform source and package integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Compile platform sources
        run: python -m compileall -q platform
      - name: Verify frozen source and round-trip package
        run: python platform/check_release.py --output "${{ runner.temp }}/platform-agent-v14.zip"
      - name: Archive verified package
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ github.sha }}
          path: ${{ runner.temp }}/platform-agent-v14.zip
          if-no-files-found: error
