name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep the runner compatible with the exact Python version in .python-version.
  python-source:
    name: Python source compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Compile controller and utility sources
        run: python -m compileall -q main.py agent scripts arcbench-agent-runtime/src

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build trusted offline image
        run: docker build -f sandbox/Dockerfile -t arcbench-sandbox:1 .
