id: ROOT
name: Community kiln schedule
slug: community-kiln-schedule
description: |-
  The board lists "Firing board"(role=heading), "North kiln"(role=link), and "Glaze notes"(role=link), and these links remain available.
pages:
  - name: Firing board
    path: /board
    reference: refs/firing-board.png
  - name: Shelf form
    path: /reserve
    reference: refs/shelf-form.png
data:
  - id: DATA-POTTER
    entity: Potter account
    lifecycle: SEED
    properties:
      email: string
      display_name: string
    records:
      - id: potter-ada
        email: ada@kiln.example
        display_name: Ada Clay
  - id: DATA-KILN
    entity: Kiln
    lifecycle: SEED
    properties:
      label: string
      temperature: string
    records:
      - id: kiln-north
        label: North kiln
        temperature: "1220 C"
  - id: DATA-SHELF
    entity: Shelf reservation
    lifecycle: RUNTIME
    properties:
      clay_body: string
      window: string
children:
  - id: REQ-BOARD
    name: Read the firing board
    description: "Use 'Public hours'(role='link') on the board."
    dependencies: []
    scenarios:
      - id: SCN-ANON
        name: Anonymous neighbor reads the board
        steps:
          - Given: The neighbor has no session and is anonymous. The board already lists North kiln.
            When: 'open "Firing board"(role=link)'
            Then: '"North kiln"(role=link) is visible'
    children: []
  - id: REQ-SIGNIN
    name: Sign in
    description: 'A potter uses "Sign in"(role=link), then "Email"(role=textbox) and "Password"(role=textbox), and "Sign in"(role=button).'
    dependencies:
      - REQ-BOARD
    scenarios:
      - id: SCN-AUTH
        name: Signed-in potter reserves a shelf
        steps:
          - keyword: GIVEN
            content: The potter is already signed in as ada@kiln.example.
          - keyword: WHEN
            content: 'fill "Clay body"(role=textbox) with "stoneware"'
          - keyword: WHEN
            content: 'click "Reserve shelf"(role=button)'
          - keyword: THEN
            content: '"Shelf reserved"(role=status) is visible'
          - The shelf queue can show "Shelf chip"(role=listitem) more than once.
          - keyword: THEN
            content: 'the url is "/reserve"'
    children: []
  - id: REQ-QUEUE
    name: Glaze labels
    description: '工作室显示“窑次”(role=button)和「釉料」(role="link")。'
    dependencies:
      - id: REQ-BOARD
    scenarios:
      - id: SCN-CN
        name: Open glaze notes
        steps:
          - Given: 访客未登录。
            When: '点击“釉料”(role=link)'
            Then: '「窑表」(role=heading) 可见'
    children: []
